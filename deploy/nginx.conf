worker_processes 1;
pid /home/fei/Work/Mots/run/nginx.pid;
error_log /home/fei/Work/Mots/logs/error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /home/fei/Work/Mots/run/client_temp;
    proxy_temp_path /home/fei/Work/Mots/run/proxy_temp;
    fastcgi_temp_path /home/fei/Work/Mots/run/fastcgi_temp;
    uwsgi_temp_path /home/fei/Work/Mots/run/uwsgi_temp;
    scgi_temp_path /home/fei/Work/Mots/run/scgi_temp;
    access_log off;
    sendfile on;
    server_tokens off;
    keepalive_timeout 30;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 127.0.0.1:8010;
        server_name mots.feizhang233.com;
        root /home/fei/Work/Mots/current/dist;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache" always;

        location / { try_files $uri $uri/ =404; }
        location /database/ { alias /home/fei/Work/Mots/current/database/; }
        location ~ /\. { deny all; }
    }
}
